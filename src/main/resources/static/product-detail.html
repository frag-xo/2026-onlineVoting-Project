<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品详情 - 温宿县农商平台</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Swiper CSS -->
    <link href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="fas fa-store me-2"></i>温宿农商
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/"><i class="fas fa-home me-1"></i>首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="#"><i class="fas fa-shopping-bag me-1"></i>商品详情</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link cart-badge-container" href="cart.html">
                            <i class="fas fa-shopping-cart me-1"></i>购物车
                            <span id="cart-count-badge" class="cart-badge" style="display: none;">0</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 商品详情 -->
    <section class="container my-5">
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">首页</a></li>
                <li class="breadcrumb-item active" id="category-name">商品详情</li>
            </ol>
        </nav>

        <div class="row g-5">
            <!-- 商品图片 -->
            <div class="col-md-6">
                <div class="swiper product-image-swiper mb-3">
                    <div class="swiper-wrapper" id="main-image-wrapper">
                        <!-- 动态加载主图 -->
                    </div>
                    <div class="swiper-pagination"></div>
                </div>
                <div class="swiper product-thumb-swiper">
                    <div class="swiper-wrapper" id="thumb-image-wrapper">
                        <!-- 动态加载缩略图 -->
                    </div>
                </div>
            </div>

            <!-- 商品信息 -->
            <div class="col-md-6">
                <h1 class="fw-bold mb-3" id="product-name">加载中...</h1>
                
                <div class="mb-3">
                    <span class="badge bg-danger me-2" id="category-badge">苹果</span>
                    <span class="text-muted"><i class="fas fa-map-marker-alt me-1"></i><span id="product-origin"></span></span>
                </div>

                <p class="text-muted" id="product-description"></p>

                <div class="bg-light p-3 rounded mb-3">
                    <div class="row align-items-center">
                        <div class="col-6">
                            <div class="text-danger">
                                <small class="text-muted">现价</small>
                                <h2 class="fw-bold mb-0">¥<span id="product-price">0.00</span></h2>
                            </div>
                            <small class="text-muted text-decoration-line-through" id="original-price"></small>
                        </div>
                        <div class="col-6 text-end">
                            <span class="badge bg-warning text-dark fs-6" id="discount-badge"></span>
                        </div>
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-6">
                        <div class="border rounded p-2 text-center">
                            <small class="text-muted">规格</small>
                            <div class="fw-bold" id="product-spec"></div>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="border rounded p-2 text-center">
                            <small class="text-muted">销量</small>
                            <div class="fw-bold"><span id="product-sales">0</span>件</div>
                        </div>
                    </div>
                </div>

                <div class="d-grid gap-2">
                    <button class="btn btn-success btn-lg" id="add-to-cart">
                        <i class="fas fa-shopping-cart me-2"></i>加入购物车
                    </button>
                    <button class="btn btn-warning btn-lg" id="buy-now">
                        <i class="fas fa-bolt me-2"></i>立即购买
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- 商品详情 -->
    <section class="bg-light py-5">
        <div class="container">
            <h3 class="fw-bold mb-4 text-center"><i class="fas fa-info-circle me-2"></i>商品详情</h3>
            <div class="row justify-content-center">
                <div class="col-md-10">
                    <div class="bg-white p-4 rounded shadow-sm" id="detail-images">
                        <!-- 动态加载详情图片 -->
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 顺手买一单 -->
    <section class="container my-5">
        <h3 class="fw-bold mb-4 text-center"><i class="fas fa-hand-holding-heart me-2"></i>顺手买一单</h3>
        <p class="text-center text-muted mb-4">买了该商品的用户还买了...</p>
        <div class="row g-4" id="recommend-products">
            <!-- 动态加载推荐商品 -->
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="bg-dark text-light py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 温宿县农商平台 版权所有</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios@1.4.0/dist/axios.min.js"></script>
    <!-- Custom JS -->
    <script src="js/product-detail.js"></script>
</body>
</html>
