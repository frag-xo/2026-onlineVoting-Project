<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>温宿县农商平台 - 首页</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Swiper CSS -->
    <link href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="fas fa-store me-2"></i>温宿农商
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/"><i class="fas fa-home me-1"></i>首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#apple-section"><i class="fas fa-apple-alt me-1"></i>苹果专区</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#walnut-section"><i class="fas fa-seedling me-1"></i>核桃专区</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link cart-badge-container" href="cart.html">
                            <i class="fas fa-shopping-cart me-1"></i>购物车
                            <span id="cart-count-badge" class="cart-badge" style="display: none;">0</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 轮播图 -->
    <div class="container-fluid px-0 mt-3">
        <div class="swiper banner-swiper">
            <div class="swiper-wrapper" id="banner-wrapper">
                <!-- 动态加载轮播图 -->
            </div>
            <div class="swiper-pagination"></div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
        </div>
    </div>

    <!-- 推荐商品 -->
    <section class="container my-5">
        <div class="section-header text-center mb-4">
            <h2 class="fw-bold text-success"><i class="fas fa-star me-2"></i>精品推荐</h2>
            <p class="text-muted">精选温宿优质农产品，品质保证</p>
        </div>
        <div class="row g-4" id="recommended-products">
            <!-- 动态加载推荐商品 -->
        </div>
    </section>

    <!-- 苹果专区 -->
    <section class="bg-light py-5" id="apple-section">
        <div class="container">
            <div class="section-header text-center mb-4">
                <h2 class="fw-bold text-danger"><i class="fas fa-apple-alt me-2"></i>阿克苏苹果</h2>
                <p class="text-muted">冰糖心苹果，甜脆可口</p>
            </div>
            <div class="row g-4" id="apple-products">
                <!-- 动态加载苹果商品 -->
            </div>
        </div>
    </section>

    <!-- 核桃专区 -->
    <section class="container my-5" id="walnut-section">
        <div class="section-header text-center mb-4">
            <h2 class="fw-bold text-warning"><i class="fas fa-seedling me-2"></i>温宿核桃</h2>
            <p class="text-muted">纸皮核桃，皮薄仁香</p>
        </div>
        <div class="row g-4" id="walnut-products">
            <!-- 动态加载核桃商品 -->
        </div>
    </section>

    <!-- 友情链接 -->
    <section class="bg-light py-4">
        <div class="container">
            <h5 class="text-center mb-4"><i class="fas fa-link me-2"></i>友情链接</h5>
            <div class="row g-3 justify-content-center" id="friend-links">
                <!-- 动态加载友情链接 -->
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="bg-dark text-light py-4 mt-5">
        <div class="container text-center">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <h5><i class="fas fa-store me-2"></i>温宿县农商平台</h5>
                    <p class="text-muted">推广温宿县优质苹果和核桃产品</p>
                </div>
                <div class="col-md-6 mb-3">
                    <h5>联系方式</h5>
                    <p class="text-muted">
                        <i class="fas fa-phone me-2"></i>0997-XXXXXXX<br>
                        <i class="fas fa-envelope me-2"></i>info@wensu.gov.cn
                    </p>
                </div>
            </div>
            <hr class="bg-secondary">
            <p class="mb-0">&copy; 2026 温宿县农商平台 版权所有</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios@1.4.0/dist/axios.min.js"></script>
    <!-- Custom JS -->
    <script src="js/home.js"></script>
</body>
</html>
