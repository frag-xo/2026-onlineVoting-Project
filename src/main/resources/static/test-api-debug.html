<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API 测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .test-section {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background-color: #45a049;
        }
        pre {
            background-color: #f4f4f4;
            padding: 10px;
            border-radius: 4px;
            max-height: 500px;
            overflow-y: auto;
        }
        .error {
            background-color: #ffebee;
            color: #c62828;
        }
        .success {
            background-color: #e8f5e9;
            color: #2e7d32;
        }
    </style>
</head>
<body>
    <h1>温宿县农商平台 - API 测试</h1>
    
    <div class="test-section">
        <h2>1. 测试首页 API</h2>
        <button onclick="testHomeApi()">测试 /api/home</button>
        <pre id="home-result"></pre>
    </div>
    
    <div class="test-section">
        <h2>2. 测试商品详情 API</h2>
        <input type="text" id="product-id" value="1" placeholder="输入商品 ID" style="padding: 8px; width: 200px;">
        <button onclick="testProductDetail()">测试 /api/product/{id}</button>
        <pre id="product-result"></pre>
    </div>
    
    <div class="test-section">
        <h2>3. 测试单个商品 API（直接访问）</h2>
        <button onclick="testDirectProduct1()">访问商品 1</button>
        <button onclick="testDirectProduct2()">访问商品 2</button>
        <button onclick="testDirectProduct4()">访问商品 4</button>
        <pre id="direct-result"></pre>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/axios@1.4.0/dist/axios.min.js"></script>
    <script>
        const API_BASE = '/api';
        
        // 测试首页 API
        async function testHomeApi() {
            const resultDiv = document.getElementById('home-result');
            try {
                resultDiv.innerHTML = '加载中...';
                const response = await axios.get(`${API_BASE}/home`);
                resultDiv.className = 'success';
                resultDiv.innerHTML = JSON.stringify(response.data, null, 2);
                console.log('首页 API 响应:', response.data);
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.innerHTML = '错误：' + error.message;
                console.error('首页 API 错误:', error);
            }
        }
        
        // 测试商品详情 API
        async function testProductDetail() {
            const pId = document.getElementById('product-id').value;
            const resultDiv = document.getElementById('product-result');
            try {
                resultDiv.innerHTML = `加载中... (请求 /api/product/${pId})`;
                const response = await axios.get(`${API_BASE}/product/${pId}`);
                resultDiv.className = 'success';
                resultDiv.innerHTML = JSON.stringify(response.data, null, 2);
                console.log(`商品 ${pId} API 响应:`, response.data);
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.innerHTML = '错误：' + error.message;
                console.error(`商品 ${pId} API 错误:`, error);
            }
        }
        
        // 直接访问商品 1
        async function testDirectProduct1() {
            await testProductDetailById('1');
        }
        
        async function testDirectProduct2() {
            await testProductDetailById('2');
        }
        
        async function testDirectProduct4() {
            await testProductDetailById('4');
        }
        
        async function testProductDetailById(pId) {
            const resultDiv = document.getElementById('direct-result');
            try {
                resultDiv.innerHTML = `加载中... (请求 /api/product/${pId})`;
                const response = await axios.get(`${API_BASE}/product/${pId}`);
                resultDiv.className = 'success';
                resultDiv.innerHTML = JSON.stringify(response.data, null, 2);
                console.log(`商品 ${pId} API 响应:`, response.data);
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.innerHTML = '错误：' + error.message;
                console.error(`商品 ${pId} API 错误:`, error);
            }
        }
    </script>
</body>
</html>
